name: Update goldens

# Goldens are recorded and compared on Linux only. Run this after an intended
# visual change, review the image diff in the commit, then keep or revert it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Record goldens
        run: flutter test --update-goldens

      - name: Commit changed goldens
        run: |
          if git diff --quiet -- test; then
            echo "Goldens unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test
          git commit -m "test(goldens): record on Linux (${GITHUB_REF_NAME})"
          git push
